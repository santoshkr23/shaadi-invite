<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wedding Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Playfair+Display:wght@500;600&family=Great+Vibes&family=Jost:wght@400;500&family=Amiri&family=Noto+Sans+Gurmukhi&family=Noto+Serif+Devanagari&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbeef1;--bg2:#f6dbe3;--ink:#5a2236;--soft:#8a5a6a;--accent:#8c1d40;--gold:#c9a24b;--card:#fffafb;--c1:#9b1b47;--c2:#5e0f2b;
--f1:'Playfair Display',Georgia,serif;--f2:'Cormorant Garamond',Georgia,'Noto Serif Devanagari','Amiri','Noto Sans Gurmukhi',serif;--f3:'Great Vibes','Snell Roundhand',cursive;--f4:'Jost',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:auto}
body{font-family:var(--f2);background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--ink);overflow-x:hidden;min-height:100vh}
body.locked{overflow:hidden;height:100vh}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bg .glow1{position:absolute;width:140vw;height:140vw;left:-20vw;top:-30vw;background:radial-gradient(circle,color-mix(in srgb,var(--gold) 28%,transparent),transparent 62%)}
#bg .glow2{position:absolute;width:120vw;height:120vw;right:-40vw;bottom:-40vw;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 20%,transparent),transparent 62%)}
#bg .tile{position:absolute;inset:0;opacity:.5}
main{position:relative;z-index:2}
section{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 22px;position:relative}
.eyebrow{max-width:92vw;font-family:var(--f4);font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--soft);margin-bottom:14px}
h2{font-family:var(--f1);font-weight:500;font-size:32px;margin-bottom:10px}
.foil{background:linear-gradient(110deg,var(--accent) 5%,var(--gold) 30%,var(--accent) 52%,var(--gold) 75%,var(--accent) 95%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
body.dark .foil{background-image:linear-gradient(110deg,#e4c370 15%,#fff8d9 38%,#e4c370 60%,#c79a3a 85%)}
@keyframes shine{to{background-position:-220% 0}}
.reveal{opacity:0;transform:translateY(26px);transition:opacity 1s ease,transform 1s ease}.reveal.in{opacity:1;transform:none}
.divider{margin:6px 0 18px;opacity:.95}
.spin{animation:spin 90s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.sway{animation:sway 6s ease-in-out infinite;transform-origin:50% 0}@keyframes sway{50%{transform:rotate(.9deg)}}
.flame{transform-origin:35px 36px;animation:flick 1.1s ease-in-out infinite alternate}.glow{animation:gl 2s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1) skewX(-3deg)}to{transform:scale(.88,1.1) skewX(4deg)}}@keyframes gl{from{opacity:.55}to{opacity:1}}
.stars{position:absolute;inset:0;pointer-events:none}.stars i{position:absolute;color:var(--gold);font-style:normal;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.15;transform:scale(.6)}}
#petals{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.petal{position:absolute;top:-30px;opacity:.8;animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(540deg)}}
/* cover */
#cover{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,var(--bg),var(--bg2));transition:opacity 1.1s ease,transform 1.1s ease;overflow:hidden}
#cover.open{opacity:0;transform:scale(1.2);pointer-events:none}
#cover .cmand{position:absolute;width:150vw;max-width:900px;opacity:.28;color:var(--gold)}
.book{width:min(76vw,310px);aspect-ratio:3/4.3;border-radius:6px 16px 16px 6px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:22px;color:#f6e2b0;cursor:pointer;animation:float 3.4s ease-in-out infinite;overflow:hidden;
 background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--c1) 85%,#fff 15%),var(--c1) 45%,var(--c2));box-shadow:0 26px 60px rgba(0,0,0,.4),inset 7px 0 0 rgba(0,0,0,.22),inset -2px 0 0 rgba(255,255,255,.1)}
.book:before{content:"";position:absolute;inset:11px;border:1.6px solid var(--gold);border-radius:4px;opacity:.9}
.book:after{content:"";position:absolute;inset:18px;border:1px dashed var(--gold);border-radius:3px;opacity:.5}
.book .shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.22) 50%,transparent 60%);transform:translateX(-120%);animation:sw 4.5s ease-in-out infinite}
@keyframes sw{60%,100%{transform:translateX(120%)}}
.book .sh{font-size:13px;letter-spacing:.06em;color:#ffe9a6;margin-top:14px;z-index:2;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.book .gan{width:62%;margin-top:6px;z-index:2;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.book .bm{position:absolute;top:6%;left:50%;width:92%;margin-left:-46%;opacity:.45;color:var(--gold)}
.book .t{font-family:var(--f1);font-style:italic;letter-spacing:.16em;font-size:19px;text-transform:uppercase;z-index:2;margin-top:6px;color:#ffe9a6}
.book .s{font-family:var(--f4);font-size:8px;letter-spacing:.3em;margin-top:6px;opacity:.9;z-index:2}
.tap{margin-top:30px;font-family:var(--f4);font-size:10px;letter-spacing:.3em;color:var(--soft);animation:pulse 1.8s infinite;z-index:2}
@keyframes float{50%{transform:translateY(-9px)}}@keyframes pulse{50%{opacity:.35}}
/* hero */
.hero{min-height:100svh;overflow:hidden;justify-content:flex-start;padding:36px 22px 120px}
.hart{position:absolute;pointer-events:none;color:var(--gold)}
.hero-in{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;width:100%;max-width:380px}
.hero .gan{width:132px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.25))}
.hero .halo{position:relative;width:210px;height:210px;display:flex;align-items:center;justify-content:center;margin-bottom:-4px}
.hero .halo .m{position:absolute;inset:0;color:var(--gold);opacity:.55}
.hero .sh{font-size:15px;color:var(--accent);margin:4px 0 8px}
.names{font-family:var(--f3);font-size:62px;line-height:1.02;margin:8px 0}
.names .amp{font-family:var(--f1);font-size:22px;display:block;margin:2px 0;letter-spacing:.2em}
.par{font-size:15px;color:var(--soft);line-height:1.4}.inv{font-style:italic;font-size:19px;margin-top:20px;line-height:1.4}
.scrollhint{position:absolute;bottom:18px;font-family:var(--f4);font-size:9px;letter-spacing:.3em;color:var(--soft);z-index:4}
.photo{width:150px;height:190px;border-radius:80px 80px 12px 12px;background-size:cover;background-position:center;border:2px solid var(--gold);box-shadow:0 10px 24px rgba(0,0,0,.25);margin-bottom:12px}
/* date scroll */
.pull{font-family:var(--f1);font-size:24px;margin-bottom:18px;cursor:pointer}
.parch{width:min(82vw,320px);position:relative}
.rod{height:16px;border-radius:8px;background:linear-gradient(180deg,#f3dc99,#b88a2d);box-shadow:0 3px 8px rgba(0,0,0,.25);position:relative;z-index:2;margin:0 -10px}
.paper{background:var(--card);border:1px solid var(--gold);margin:0 8px;overflow:hidden;max-height:0;transition:max-height 1.5s cubic-bezier(.2,.8,.2,1);position:relative}
.paper.open{max-height:340px}.paper .pm{position:absolute;width:260px;left:50%;top:50%;margin:-130px 0 0 -130px;opacity:.14;color:var(--gold)}
.paper .in{padding:28px 14px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.paper .dow{font-family:var(--f4);font-size:10px;letter-spacing:.3em;color:var(--soft);text-transform:uppercase}
.paper .day{font-family:var(--f1);font-size:70px;line-height:1}.paper .mon{font-style:italic;font-size:28px}
.paper .yr{font-family:var(--f4);letter-spacing:.3em;font-size:11px;color:var(--soft)}.paper .at{font-size:14px;color:var(--soft);margin-top:8px}
.tassel{width:4px;height:42px;background:var(--accent);margin:0 auto;position:relative;cursor:pointer;border-radius:2px}
.tassel:after{content:"";position:absolute;bottom:-14px;left:-7px;width:18px;height:22px;background:var(--accent);border-radius:3px 3px 50% 50%}
.cd{display:flex;gap:12px;margin-top:34px;justify-content:center}
.cd div{min-width:62px;padding:10px 4px;border:1px solid color-mix(in srgb,var(--gold) 60%,transparent);border-radius:14px;background:color-mix(in srgb,var(--card) 70%,transparent);backdrop-filter:blur(4px)}
.cd b{display:block;font-family:var(--f1);font-size:26px;color:var(--accent);font-weight:500}.cd span{font-family:var(--f4);font-size:8px;letter-spacing:.25em;color:var(--soft)}
.btn{font-family:var(--f4);font-size:10px;letter-spacing:.2em;text-transform:uppercase;border:1px solid var(--accent);color:var(--accent);background:transparent;padding:12px 20px;border-radius:30px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.fill{background:var(--accent);color:var(--card)}body.dark .btn.fill{color:#10101a}
/* function cards */
.rail{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;width:100vw;padding:6px 12vw 18px;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}
.fc{flex:0 0 76vw;max-width:310px;scroll-snap-align:center;border-radius:26px;overflow:hidden;background:var(--card);box-shadow:0 18px 40px rgba(0,0,0,.2);text-align:center;border:1px solid color-mix(in srgb,var(--gold) 50%,transparent)}
.fc .top{height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;background:linear-gradient(160deg,var(--g1),var(--g2));position:relative;overflow:hidden}
.fc .top .fm{position:absolute;width:300px;left:50%;top:50%;margin:-150px 0 0 -150px;color:#fff;opacity:.2}
.fc .em{font-size:50px;background:rgba(255,255,255,.28);width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;border:1px solid rgba(255,255,255,.6);box-shadow:0 0 0 7px rgba(255,255,255,.12)}
.fc .when{font-family:var(--f4);font-size:9px;letter-spacing:.25em;text-transform:uppercase;position:relative}
.fc .bot{padding:16px 16px 22px}.fc h3{font-family:var(--f1);font-weight:500;font-size:25px}.fc .pl{font-size:14px;color:var(--soft);margin:4px 0 12px}
.fc .dc{font-size:13px;border:1px dashed color-mix(in srgb,var(--gold) 70%,transparent);border-radius:12px;padding:8px 12px;display:inline-block}
.fc .dc i{font-family:var(--f4);font-style:normal;font-size:8px;letter-spacing:.2em;color:var(--soft);display:block}
.dots{display:flex;gap:6px;margin-top:6px}.dots i{width:6px;height:6px;border-radius:3px;background:var(--soft);opacity:.35;transition:all .3s}.dots i.on{width:20px;background:var(--accent);opacity:1}
.gph{height:56vh;max-height:460px;background-size:cover;background-position:center;border:3px solid var(--gold)}
.story{max-width:330px;font-size:20px;line-height:1.55;font-style:italic}
.map{width:min(84vw,330px);height:170px;border-radius:18px;border:1px solid var(--gold);background:linear-gradient(115deg,transparent 46%,rgba(255,255,255,.7) 47% 50%,transparent 51%),linear-gradient(30deg,transparent 60%,rgba(255,255,255,.6) 61% 63%,transparent 64%),radial-gradient(ellipse at 30% 70%,rgba(120,170,200,.35) 0 22%,transparent 23%),var(--bg2);position:relative;margin-bottom:18px}
.map:after{content:"📍";position:absolute;left:62%;top:34%;font-size:34px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3))}
.vn{font-family:var(--f1);font-size:25px}.ad{font-size:15px;color:var(--soft);max-width:300px;margin:6px 0 18px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.foot{font-family:var(--f3);font-size:38px;margin-top:40px}
.sect-art{position:absolute;left:0;right:0;pointer-events:none}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--card);font-family:var(--f4);font-size:11px;padding:10px 18px;border-radius:20px;opacity:0;transition:opacity .3s;z-index:30}#toast.on{opacity:1}
#music{position:fixed;right:14px;bottom:18px;z-index:25;width:42px;height:42px;border-radius:50%;border:1px solid var(--gold);background:var(--card);color:var(--accent);font-size:18px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .6s}
#music.show{opacity:1;pointer-events:auto}body.rec #music,body.rec .tap{display:none}
</style>
</head>
<body class="locked">
<div id="petals"></div>
<div id="bg"></div>
<div id="cover"></div>
<main id="main"></main>
<div id="toast"></div><button id="music" title="Music">🎵</button><audio id="aud" src="/music.mp3" loop preload="none"></audio>
<script src="/templates.js"></script>
<script src="/art.js"></script>
<script src="/deco.js"></script>
<script>
const $=s=>document.querySelector(s);
const q=new URLSearchParams(location.search);
const REC=q.has('record');
if(REC)document.body.classList.add('rec');
let D=null;



function render(d){
  D=d;$('#aud').src=d.music||'/music.mp3';document.body.className=(REC?'rec ':'')+'locked';const T=getTemplate(d.theme);applyTemplate(T);$('#cover').innerHTML=coverHTML(d);const tl=tileURL(T.sk,T.v['--gold']);$('#bg').innerHTML=`<div class="glow1"></div><div class="glow2"></div><div class="tile" style="${tl?'background-image:'+tl.replace(/"/g,'&quot;'):''}"></div>`;
  const g=esc(d.groom.name),b=esc(d.bride.name);
  document.title=`${d.groom.name} weds ${d.bride.name}`;
  const wd=fmtDate(d.date,d.time);
  const par=p=>[p.father&&('Mr. '+esc(p.father)),p.mother&&('Mrs. '+esc(p.mother))].filter(Boolean).join(' & ');
  const gp=par(d.groom),bp=par(d.bride);
  const fns=d.functions.map((f,i)=>{const [a,c]=PAL[i%PAL.length];let when='';
    if(f.date){const m=f.date.match(/^(\d{4})-(\d{2})-(\d{2})$/);when=m?`${DOW[new Date(+m[1],+m[2]-1,+m[3]).getDay()].slice(0,3)} · ${+m[3]} ${MON[+m[2]-1].slice(0,3)}`:esc(f.date)}
    if(f.time)when+=(when?' · ':'')+(/^\d{2}:\d{2}$/.test(f.time)?time12(f.time):esc(f.time));
    return `<div class="fc" style="--g1:${a};--g2:${c}"><div class="top"><div class="fm spin">${MANDALA_SM()}</div><div class="em">${emoji(f.name)}</div><div class="when">${when}</div></div><div class="bot"><h3>${esc(f.name)}</h3><div class="pl">${esc(f.place)}</div>${f.dress?`<div class="dc"><i>DRESS CODE</i>${esc(f.dress)}</div>`:''}</div></div>`}).join('');
  $('#main').innerHTML=`
  <section class="hero">${heroArt(T.sk)}<div class="hero-in reveal">
    <div class="halo"><div class="m spin">${MANDALA_SM()}</div><div class="gan">${trad(d).motif()}</div></div>
    <div class="sh">${trad(d).head}</div>
    ${d.photo?`<div class="photo" style="background-image:url('${esc(d.photo)}')"></div>`:''}
    <div class="eyebrow">Together with their families</div>
    <div class="names foil">${g}<span class="amp">&amp;</span>${b}</div>
    ${gp?`<div class="par">son of ${gp}</div>`:''}${bp?`<div class="par" style="margin-top:4px">daughter of ${bp}</div>`:''}
    <div class="inv">request the pleasure of your<br>company at their wedding</div></div>
    <div class="scrollhint">SCROLL ⌄</div></section>
  <section>${HA("right:-90px;top:30px;width:240px;opacity:.22",MANDALA_SM())}<div class="eyebrow">Save the date</div>${divider()}<div class="pull">Pull to Reveal</div>
    <div class="parch"><div class="rod"></div><div class="paper" id="paper"><div class="pm spin">${MANDALA_SM()}</div><div class="in">
      <div class="dow">${wd.dow}</div><div class="day foil">${wd.d}</div><div class="mon">${wd.m}</div><div class="yr">${wd.y}</div>
      <div class="at">${time12(d.time)}${d.venue?' · '+esc(d.venue):''}</div></div></div>
      <div class="rod"></div><div class="tassel" id="tassel"></div></div>
    <div class="eyebrow" style="margin-top:22px">See you on ${wd.dow}, ${wd.d} ${wd.m} ${wd.y}</div>
    <div class="cd" id="cd"></div><div style="margin-top:22px"><button class="btn" id="cal">＋ Add to calendar</button></div></section>
  ${d.functions.length?`<section style="padding-left:0;padding-right:0"><div class="eyebrow">Swipe through the celebrations</div><h2 class="foil">Wedding Festivities</h2>${divider()}
    <div class="rail" id="rail">${fns}</div><div class="dots" id="dots">${d.functions.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>
    <div class="eyebrow" style="margin-top:14px">‹ Swipe to see every function ›</div></section>`:''}
  ${(d.photos||[]).length?`<section style="padding-left:0;padding-right:0"><div class="eyebrow">Moments</div><h2 class="foil">Our Gallery</h2>${divider()}<div class="rail" id="gal">${d.photos.map(p=>`<div class="fc gph" style="background-image:url('${esc(p)}')"></div>`).join('')}</div></section>`:''}
  ${d.story?`<section><div class="eyebrow">Moments</div><h2 class="foil">Our Story</h2>${divider()}<p class="story">${esc(d.story)}</p></section>`:''}
  <section><div class="eyebrow">Location</div><h2 class="foil">How to Reach</h2>${divider()}<div class="map"></div>
    <div class="vn">${esc(d.venue)}</div><div class="ad">${esc(d.address)}</div>
    <div class="row"><a class="btn fill" target="_blank" rel="noopener" href="${esc(d.maps||('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(d.venue+' '+d.address)))}">➤ Get directions</a><button class="btn" id="copy">Copy address</button></div></section>
  <section><div class="eyebrow">Kindly respond</div><h2 class="foil">Will you join us?</h2>${divider()}
    <div class="row"><button class="btn fill" data-r="Yes, I will be there 🎉">Joyfully accept</button><button class="btn" data-r="Sorry, I can't make it 🙏">Regretfully decline</button></div>
    <p class="foot foil">${esc(d.closing||`With love, ${d.groom.name} & ${d.bride.name}`)}</p></section>`;
  petals(T.glyph);
  // reveal on scroll
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}),{threshold:.2});
  document.querySelectorAll('.reveal').forEach(e=>io.observe(e));
  document.querySelectorAll('section').forEach(s=>{s.classList.add('reveal');io.observe(s)});
  // scroll toggle
  const paper=$('#paper');const tog=()=>paper.classList.toggle('open');
  $('#tassel').onclick=tog;$('.pull').onclick=tog;
  new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&!paper.dataset.auto){paper.dataset.auto=1;setTimeout(()=>paper.classList.add('open'),900)}}),{threshold:.6}).observe(paper);
  // countdown
  const target=new Date(wd.y,wd.dt.getMonth(),wd.d,...d.time.split(':').map(Number));
  const tick=()=>{let s=Math.max(0,Math.floor((target-Date.now())/1000));const dd=Math.floor(s/86400);s%=86400;const h=Math.floor(s/3600);s%=3600;const m=Math.floor(s/60);s%=60;
    $('#cd').innerHTML=[[dd,'DAYS'],[h,'HRS'],[m,'MIN'],[s,'SEC']].map(([n,l])=>`<div><b>${n}</b><span>${l}</span></div>`).join('')};
  tick();setInterval(tick,1000);
  // calendar (.ics)
  $('#cal').onclick=()=>{const p=n=>String(n).padStart(2,'0');const st=`${wd.y}${p(wd.dt.getMonth()+1)}${p(wd.d)}T${d.time.replace(':','')}00`;
    const clean=s=>String(s).replace(/[\\;,\n]/g,' ');
    const ics=['BEGIN:VCALENDAR','VERSION:2.0','BEGIN:VEVENT',`DTSTART:${st}`,`DTEND:${st}`,`SUMMARY:${clean(d.groom.name)} weds ${clean(d.bride.name)}`,`LOCATION:${clean(d.venue+' '+d.address)}`,'END:VEVENT','END:VCALENDAR'].join('\r\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));a.download='wedding.ics';a.click()};
  // carousel dots
  const rail=$('#rail');if(rail)rail.addEventListener('scroll',()=>{const c=rail.children;const mid=rail.scrollLeft+rail.clientWidth/2;let best=0,bd=1e9;
    [...c].forEach((el,i)=>{const dd=Math.abs(el.offsetLeft+el.offsetWidth/2-mid);if(dd<bd){bd=dd;best=i}});
    [...$('#dots').children].forEach((x,i)=>x.classList.toggle('on',i===best))});
  // copy + rsvp
  $('#copy').onclick=()=>{navigator.clipboard?.writeText(`${d.venue}, ${d.address}`);toast('Address copied')};
  document.querySelectorAll('[data-r]').forEach(bn=>bn.onclick=()=>{
    if(!d.rsvp)return toast('Thank you! 💌');
    open(`https://wa.me/${d.rsvp}?text=${encodeURIComponent(`${bn.dataset.r} — ${d.groom.name} & ${d.bride.name}'s wedding`)}`,'_blank')});
}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}
function openCover(){$('#cover').classList.add('open');document.body.classList.remove('locked');
  if(!REC&&!q.has('preview')){const a=$('#aud');a.volume=.55;a.play().then(()=>{$('#music').classList.add('show')}).catch(()=>$('#music').classList.add('show'))}}
$('#music').onclick=()=>{const a=$('#aud');if(a.paused){a.play();$('#music').textContent='🎵'}else{a.pause();$('#music').textContent='🔇'}};
$('#cover').onclick=openCover;

// auto tour used for video recording
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function glide(to,ms){const from=scrollY,t0=performance.now();
  await new Promise(res=>{const f=n=>{const k=Math.min(1,(n-t0)/ms),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;scrollTo(0,from+(to-from)*e);k<1?requestAnimationFrame(f):res()};requestAnimationFrame(f)})}
window.runTour=async()=>{
  await sleep(2200);openCover();await sleep(1800);
  const secs=[...document.querySelectorAll('section')];
  for(let i=1;i<secs.length;i++){
    await glide(secs[i].offsetTop,1600);await sleep(i===1?3200:1200);
    if(secs[i].querySelector('#rail')){const r=$('#rail');for(let k=1;k<r.children.length;k++){r.scrollTo({left:r.children[k].offsetLeft-(r.clientWidth-r.children[k].offsetWidth)/2,behavior:'smooth'});await sleep(1500)}}
  }
  await sleep(1500);
};

if(q.has('preview')){addEventListener('message',e=>{if(e.data&&e.data.invite)render(e.data.invite)});parent.postMessage({ready:1},'*')}
else{fetch('/api/invites/'+location.pathname.split('/').pop()).then(r=>r.json()).then(render).catch(()=>{$('#main').innerHTML='<section><h2>Invite not found</h2></section>'})}
</script>
</body>
